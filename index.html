<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple Task Manager web application">
    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="task-card">

            <header>
                <div class="icon">✓</div>
                <h1>Task Manager</h1>
                <p>Organize your daily tasks efficiently</p>
            </header>

            <div class="task-input-section">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                    maxlength="100"
                >

                <button id="addTaskBtn" type="button">
                    Add Task
                </button>
            </div>

            <p id="errorMessage" class="error-message"></p>

            <div class="task-summary">
                <div>
                    <span id="totalTasks">0</span>
                    <small>Total</small>
                </div>

                <div>
                    <span id="completedTasks">0</span>
                    <small>Completed</small>
                </div>

                <div>
                    <span id="pendingTasks">0</span>
                    <small>Pending</small>
                </div>
            </div>

            <div class="tasks-header">
                <h2>My Tasks</h2>

                <button id="clearCompletedBtn" type="button">
                    Clear Completed
                </button>
            </div>

            <ul id="taskList"></ul>

            <div id="emptyMessage" class="empty-message">
                <div>📝</div>
                <h3>No tasks yet</h3>
                <p>Add a task above to get started.</p>
            </div>

        </div>

        <footer>
            <p>Minor Project 2 • Task Manager</p>
            <p>Built using HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
